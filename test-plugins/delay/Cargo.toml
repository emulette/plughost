[package]
name = "plughost-test-delay"
description = "VST3 and CLAP test plugin that delays its input by a fixed, reported latency"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
clack-extensions = { workspace = true, features = ["audio-ports", "clack-plugin", "gui", "latency", "log", "note-ports", "params", "state", "state-context", "tail", "thread-check", "timer"] }
clack-plugin.workspace = true
vst3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
block2.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["NSBitmapImageRep", "NSColor", "NSCursor", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSCell", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSSavePanel", "NSTrackingArea", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
