[package]
name = "plughost-test-synth"
description = "CLAP and VST3 test instrument whose output shows exactly when notes, expressions and MIDI arrive"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
clack-extensions = { workspace = true, features = ["audio-ports", "clack-plugin", "gui", "note-ports"] }
clack-plugin.workspace = true
vst3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
