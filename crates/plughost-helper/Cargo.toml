[package]
name = "plughost-helper"
description = "Helper process that loads and runs plugins for plughost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/plughost-helper"
publish = true
include = ["/src/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["audio", "plugin", "vst3", "clap", "audio-unit"]
categories = ["multimedia::audio"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true

[[test]]
name = "events"
harness = false

[features]
# Audits the processing thread for allocations, locks and system calls (see `plughost_core::audit`);
# not for shipping.
realtime-audit = ["plughost-core/realtime-audit", "plughost-formats/realtime-audit"]

[dependencies]
interprocess.workspace = true
plughost-core.workspace = true
plughost-formats.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
