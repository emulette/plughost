name: Maintenance

# Manual only. Fresh dependencies and the advisory database are inputs we do not control, so a push tier
# would redden unchanged commits and an unchanged tag could stop publishing. Dispatch it before
# tagging a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  advisories:
    name: Fresh advisory database check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check the workspace against today's advisories
        run: cargo deny --locked --all-features check advisories

  dependencies:
    name: ${{ matrix.dependencies }} dependencies on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        dependencies: [latest, direct-minimal]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the minimum supported toolchain
        run: rustup show
      - name: Install the resolver toolchain
        if: matrix.dependencies == 'direct-minimal'
        run: rustup toolchain install nightly --profile minimal
      - name: Resolve latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: cargo update
      - name: Resolve the lowest direct dependencies
        if: matrix.dependencies == 'direct-minimal'
        run: cargo +nightly update -Z direct-minimal-versions
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vst3sdk/vst-sdk.zip
          key: vst3-sdk-3.8.1-build-84
      - name: Build macOS fixtures and helper
        if: runner.os == 'macOS'
        run: |
          scripts/build-test-plugins.sh
          scripts/build-helper.sh
      - name: Build Windows fixtures and helper
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -File scripts/build-test-plugins.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/build-helper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the resolved dependencies on the minimum supported Rust version
        run: cargo test --workspace --locked -- --include-ignored
