name: Maintenance

# Manual only. Fresh dependencies, the latest stable Rust and the advisory database are inputs we
# do not control, so a push tier would redden unchanged commits and an unchanged tag could stop
# publishing. Dispatch it before tagging a release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  advisories:
    name: Fresh advisory database check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check the workspace against today's advisories
        run: cargo deny --locked --all-features check advisories

  stable:
    name: Latest stable Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            verify: scripts/verify-macos.sh
          - os: windows-2022
            verify: pwsh -NoProfile -File scripts/verify-windows.ps1
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the latest stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vst3sdk/vst-sdk.zip
          key: vst3-sdk-3.8.1-build-84
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Build fixtures and helper, test, lint, document, check dependencies
        run: ${{ matrix.verify }}

  dependencies:
    name: ${{ matrix.dependencies }} dependencies on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        dependencies: [latest, direct-minimal]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the minimum supported toolchain
        run: rustup show
      - name: Install the resolver toolchain
        if: matrix.dependencies == 'direct-minimal'
        run: rustup toolchain install nightly --profile minimal
      - name: Resolve latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: cargo update
      - name: Resolve the lowest direct dependencies
        if: matrix.dependencies == 'direct-minimal'
        run: cargo +nightly update -Z direct-minimal-versions
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vst3sdk/vst-sdk.zip
          key: vst3-sdk-3.8.1-build-84
      - name: Build macOS fixtures and helper
        if: runner.os == 'macOS'
        run: |
          scripts/build-test-plugins.sh
          scripts/build-helper.sh
      - name: Build Windows fixtures and helper
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -File scripts/build-test-plugins.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/build-helper.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the resolved dependencies on the minimum supported Rust version
        run: cargo test --workspace --locked -- --include-ignored --skip benchmark

  fuzz:
    name: Parser corpus and AddressSanitizer fuzzing
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Replay parser regression corpus
        run: cargo test -p plughost -p plughost-core -p plughost-formats --lib --locked corpus
      - name: Fuzz each parser with AddressSanitizer and bounded resources
        run: python3 fuzz/run.py --seconds 60
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parser-fuzz-failures
          path: target/fuzz-artifacts
          if-no-files-found: ignore
