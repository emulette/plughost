name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: Validate the release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject refs that are not a vMAJOR.MINOR.PATCH tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'not a release tag: %s\n' "$RELEASE_REF" >&2; exit 1 ;;
          esac

      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Publishing reads the version from the manifests, not from the tag, so a tag that disagrees
      # with them would ship the wrong version under the right name. crates.io never lets a
      # version number be reused, so nothing downstream can undo that.
      - name: Require the tag to match the workspace version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          tagged="${RELEASE_REF#refs/tags/v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            printf '::error::tag v%s does not match the workspace version %s\n' \
              "$tagged" "$declared"
            exit 1
          fi
          printf 'releasing version %s\n' "$declared"

      # The GitHub release notes are this section, so an undated or missing entry fails here
      # instead of after the crates are already on the registry.
      - name: Require a dated changelog entry for the version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            printf '::error::CHANGELOG.md has no dated "## [%s] - YYYY-MM-DD" heading\n' "$version"
            exit 1
          fi

  core:
    name: macOS and Windows verification
    needs: release-ref
    uses: ./.github/workflows/ci.yml

  # The environment is where a required reviewer belongs: an upload cannot be undone.
  #
  # Re-run safe: each crate is skipped when crates.io already serves this version, so a rerun of a
  # partially published tag finishes the remaining crates instead of failing on the first one.
  #
  # macOS, not Linux: `cargo publish` builds each package before uploading it, and the crates do
  # not compile outside macOS and Windows.
  #
  # crates.io cannot mint a crate's first release over OIDC, so 0.0.1 uses the
  # CARGO_REGISTRY_TOKEN secret. Once all four crates exist, attach their trusted publishers,
  # delete the secret, and mint the token with rust-lang/crates-io-auth-action instead.
  publish-crates-io:
    name: Publish the crates to crates.io
    needs: core
    runs-on: macos-15
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show

      # Each crate requires the exact version of the ones before it, so the order is load bearing.
      # A probe failure leaves the crate unpublished: publishing stays the authoritative act and at
      # worst reproduces the duplicate-version error.
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for crate in plughost-core plughost-formats plughost-helper plughost; do
            if response="$(curl --fail --silent --show-error \
              --header 'User-Agent: plughost-release (https://github.com/emulette/plughost)' \
              "https://crates.io/api/v1/crates/$crate/versions")" &&
              printf '%s' "$response" | jq --exit-status --arg version "$version" \
                'any(.versions[]; .num == $version)' >/dev/null; then
              printf '%s %s is already on crates.io; skipping\n' "$crate" "$version"
              continue
            fi
            printf '::group::%s\n' "$crate"
            cargo publish --locked --package "$crate"
            printf '::endgroup::\n'
          done

  # A GitHub release can be edited or deleted, unlike a registry upload, so it needs no reviewer.
  github-release:
    name: Publish the GitHub release
    needs: publish-crates-io
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Publish the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release %s already exists; skipping\n' "$RELEASE_TAG"
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
