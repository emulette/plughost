[workspace]
members = [
    "crates/plughost-core",
    "crates/plughost-formats",
    "crates/plughost-helper",
    "crates/plughost",
    "test-plugins/delay",
    "test-plugins/presets",
    "test-plugins/routing",
    "test-plugins/synth",
]
default-members = ["crates/plughost", "crates/plughost-helper"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emulette/plughost"

[workspace.dependencies]
block2 = "0.6.2"
clack-extensions = "0.2.0"
clack-host = "0.2.0"
clack-plugin = "0.2.0"
clap-sys = "0.5.0"
interprocess = "2.4.4"
json5 = "1.3.1"
libc = "0.2.189"
libloading = "0.8.9"
memmap2 = "0.9.11"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
objc2-audio-toolbox = "0.3.2"
objc2-avf-audio = "0.3.2"
objc2-core-audio-kit = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSObjCRuntime"] }
plughost-core = { path = "crates/plughost-core", version = "=0.1.0" }
plughost-formats = { path = "crates/plughost-formats", version = "=0.1.0" }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rustix = { version = "1.1.5", features = ["net", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
vst3 = "0.3.0"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
